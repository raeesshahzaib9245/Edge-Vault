name: Build EDGEVAULT Android app from project ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "EDGEVAULT_Android_Project.zip"
      - ".github/workflows/build-edgevault-from-zip.yml"

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project ZIP
        run: unzip -oq EDGEVAULT_Android_Project.zip

      - name: Restore release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > EdgeVault-Android/app/release-keystore.jks
          else
            echo "No signing keystore secret set; bundleRelease will be unsigned."
          fi

      - name: Build debug APK and release AAB
        env:
          ANDROID_KEYSTORE_PATH: EdgeVault-Android/app/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -p EdgeVault-Android clean assembleDebug bundleRelease

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edgevault-android-build
          path: |
            EdgeVault-Android/app/build/outputs/apk/debug/*.apk
            EdgeVault-Android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
